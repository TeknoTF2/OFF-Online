<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OFF Room Renderer — procedural proof</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{background:#0a0a0a;color:#f4f2ec;font-family:'IBM Plex Mono',monospace;display:flex;flex-direction:column;
  align-items:center;gap:14px;padding:24px;image-rendering:pixelated}
h1{font-family:'Jersey 10',monospace;font-size:34px;letter-spacing:2px;font-weight:400}
.bar{display:flex;gap:10px;align-items:center}
button{background:#161616;border:1px solid #333;color:#f4f2ec;font-family:'Jersey 10',monospace;
  font-size:20px;padding:4px 16px;cursor:pointer}
button:hover{border-color:#f2a71b;color:#f2a71b}
button.on{background:#f4f2ec;color:#0a0a0a}
canvas{border:4px solid #000;image-rendering:pixelated;width:768px;height:576px}
.note{font-size:11px;color:#777;max-width:760px;text-align:center}
</style>
</head>
<body>
<h1>PROCEDURAL ROOM PROOF</h1>
<div class="bar">
  <button class="on" onclick="loadRoom(0,this)">Storeroom</button>
  <button onclick="loadRoom(1,this)">Carpet Hall</button>
  <span style="width:20px"></span>
  <button onclick="setPal('z1',this)">Z1</button>
  <button onclick="setPal('z2',this)">Z2</button>
  <button class="on" onclick="setPal('z3',this)">Z3</button>
  <button onclick="setPal('room',this)">Room</button>
  <span style="width:20px"></span>
  <button onclick="showCol=!showCol;draw()">Collision</button>
</div>
<canvas id="c" width="384" height="288"></canvas>
<div class="note">Every pixel above is drawn by code from ~30 lines of JSON per room. No tilesets, no image files.
Collision (toggle it) is derived from walls and solid props automatically. Same data, any zone palette.</div>

<script>
const ctx=document.getElementById('c').getContext('2d');
const T=16; let showCol=false;
const PALS={
  z1:{lite:'#7fb2d9',dark:'#2e6d9e',floor:'#cfe3f2',ink:'#000'},
  z2:{lite:'#eac06a',dark:'#c8871c',floor:'#f4e2bb',ink:'#000'},
  z3:{lite:'#8fd18f',dark:'#2f9e44',floor:'#c9ecc9',ink:'#000'},
  room:{lite:'#e07f7c',dark:'#d0231f',floor:'#f2c9c7',ink:'#000'},
};
let pal=PALS.z3, room;

/* ---------- primitives ---------- */
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function box(x,y,w,h,fill){px(x,y,w,h,pal.ink);px(x+1,y+1,w-2,h-2,fill);}

/* ---------- floor patterns ---------- */
function floorBrackets(r){ // corner-bracket grid, per screenshot 2
  px(r.x,r.y,r.w,r.h,pal.dark);
  for(let y=r.y+8;y<r.y+r.h-8;y+=T*2)for(let x=r.x+8;x<r.x+r.w-8;x+=T*2){
    ctx.fillStyle=pal.lite;
    ctx.fillRect(x,y,6,2);ctx.fillRect(x,y,2,6);
    ctx.fillRect(x+12,y,6,2);ctx.fillRect(x+16,y,2,6);
    ctx.fillRect(x,y+16,6,2);ctx.fillRect(x,y+12,2,6);
    ctx.fillRect(x+12,y+16,6,2);ctx.fillRect(x+16,y+12,2,6);
  }
}
function floorCarpet(r){ // dense chevron carpet, per screenshot 1
  px(r.x,r.y,r.w,r.h,pal.dark);
  ctx.fillStyle='rgba(0,0,0,.25)';
  for(let y=r.y;y<r.y+r.h;y+=6)
    for(let x=r.x;x<r.x+r.w;x+=8){
      ctx.fillRect(x,y+(x/8%2?0:2),4,2);
    }
}
function floorPlain(r){px(r.x,r.y,r.w,r.h,pal.floor);}
const FLOORS={brackets:floorBrackets,carpet:floorCarpet,plain:floorPlain};

/* ---------- walls ---------- */
function wall(r){
  box(r.x,r.y,r.w,r.h,pal.lite);
  px(r.x+1,r.y+r.h-5,r.w-2,4,pal.dark);           // base shadow band
}

/* ---------- props (each ~10 lines) ---------- */
const PROPS={
crate(x,y){box(x,y,20,16,pal.lite);
  px(x+2,y+2,16,2,pal.dark);px(x+2,y+7,16,2,pal.dark);px(x+2,y+12,16,2,pal.dark);
  px(x+4,y+2,2,12,pal.ink);px(x+14,y+2,2,12,pal.ink);},
barrel(x,y){box(x,y,14,18,pal.lite);
  px(x+1,y+4,12,2,pal.ink);px(x+1,y+12,12,2,pal.ink);
  px(x+3,y+1,3,3,pal.floor);},
cabinet(x,y){box(x,y,18,22,'#4a4a4a');
  px(x+3,y+3,12,7,'#6b6b6b');px(x+3,y+12,12,7,'#6b6b6b');
  px(x+7,y+5,4,2,pal.ink);px(x+7,y+14,4,2,pal.ink);},
bottles(x,y){for(let i=0;i<4;i++)for(let j=0;j<2;j++){
  box(x+i*7,y+j*10,6,9,pal.lite);px(x+i*7+2,y+j*10-2,2,3,pal.ink);}},
counter(x,y,w){box(x,y,w,12,pal.lite);px(x+1,y+9,w-2,2,pal.dark);
  px(x+2,y+12,3,8,pal.ink);px(x+w-5,y+12,3,8,pal.ink);},
rug(x,y){px(x,y,44,26,pal.floor);px(x+2,y+2,40,22,pal.dark);px(x+4,y+4,36,18,pal.floor);},
door(x,y){box(x,y,22,6,pal.floor);px(x+9,y+2,4,2,pal.dark);},
plant(x,y){box(x,y+8,10,8,pal.lite);px(x+2,y,2,8,pal.ink);px(x+6,y+2,2,6,pal.ink);px(x+1,y-2,4,4,pal.dark);px(x+6,y,4,4,pal.dark);},
};
const SOLID={crate:1,barrel:1,cabinet:1,bottles:1,counter:1,plant:1};

/* ---------- rooms as data ---------- */
const ROOMS=[
{ name:'storeroom', letterbox:true,
  bounds:{x:48,y:40,w:288,h:208},
  floors:[{p:'brackets',x:48,y:40,w:288,h:208}],
  walls:[{x:48,y:40,w:288,h:26}],
  props:[
    {t:'counter',x:60,y:78,w:120},
    {t:'crate',x:64,y:44},{t:'crate',x:86,y:44},{t:'crate',x:75,y:30},
    {t:'bottles',x:130,y:42},
    {t:'cabinet',x:180,y:42},{t:'cabinet',x:210,y:42},{t:'cabinet',x:240,y:42},
    {t:'barrel',x:300,y:86},{t:'barrel',x:316,y:100},{t:'bottles',x:300,y:130},
    {t:'crate',x:56,y:210},{t:'crate',x:56,y:194},
    {t:'barrel',x:300,y:200},{t:'barrel',x:316,y:210},{t:'bottles',x:296,y:170},
    {t:'door',x:170,y:244},
  ]},
{ name:'carpet hall', letterbox:false,
  bounds:{x:24,y:16,w:336,h:256},
  floors:[
    {p:'plain',x:24,y:16,w:336,h:256},
    {p:'carpet',x:120,y:16,w:96,h:256},
    {p:'carpet',x:24,y:150,w:336,h:60},
  ],
  walls:[
    {x:24,y:16,w:96,h:110},{x:216,y:16,w:144,h:96},
    {x:24,y:210,w:120,h:62},{x:260,y:210,w:100,h:62},
  ],
  props:[
    {t:'cabinet',x:36,y:24},{t:'cabinet',x:62,y:24},{t:'cabinet',x:36,y:54},{t:'cabinet',x:62,y:54},
    {t:'cabinet',x:300,y:24},{t:'cabinet',x:326,y:24},
    {t:'rug',x:40,y:160},
    {t:'crate',x:230,y:120},{t:'crate',x:252,y:120},{t:'crate',x:241,y:106},
    {t:'crate',x:230,y:180},{t:'barrel',x:262,y:176},
    {t:'plant',x:200,y:120},
    {t:'door',x:150,y:266},
  ]},
];

/* ---------- render + derived collision ---------- */
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,384,288);
  const r=room;
  r.floors.forEach(f=>FLOORS[f.p](f));
  // room outline
  ctx.strokeStyle='#000';ctx.lineWidth=3;
  ctx.strokeRect(r.bounds.x,r.bounds.y,r.bounds.w,r.bounds.h);
  r.walls.forEach(wall);
  r.props.forEach(p=>PROPS[p.t](p.x,p.y,p.w));
  if(showCol){ // derived: walls + solid props, snapped to grid
    ctx.fillStyle='rgba(208,35,31,.45)';
    r.walls.forEach(w=>ctx.fillRect(w.x,w.y,w.w,w.h));
    r.props.filter(p=>SOLID[p.t]).forEach(p=>{
      const gx=Math.floor(p.x/T)*T,gy=Math.floor(p.y/T)*T;
      ctx.fillRect(gx,gy,(p.w?Math.ceil(p.w/T)*T:T*2),T*2);});
  }
}
function loadRoom(i,btn){room=ROOMS[i];draw();
  document.querySelectorAll('.bar button').forEach((b,j)=>{if(j<2)b.classList.toggle('on',j===i)});}
function setPal(k,btn){pal=PALS[k];draw();
  [...document.querySelectorAll('.bar button')].slice(2,6).forEach(b=>b.classList.toggle('on',b===btn));}
room=ROOMS[0];draw();
</script>
</body>
</html>
